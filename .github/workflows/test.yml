name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install requirements
        run: |
          pip install -r requirements.txt
          ls -alR
      
      - name: Debug pytest
        run: pytest